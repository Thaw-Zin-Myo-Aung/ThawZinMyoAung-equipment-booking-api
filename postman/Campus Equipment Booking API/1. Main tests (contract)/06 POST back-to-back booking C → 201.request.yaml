$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "equipmentId": "eq-1",
      "borrowerName": "Suda Rakdee",
      "startAt": "2026-10-20T11:00:00.000Z",
      "endAt": "2026-10-20T12:00:00.000Z",
      "purpose": "Workshop"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("bookingCId", pm.response.json().id);
    language: text/javascript
order: 6000
