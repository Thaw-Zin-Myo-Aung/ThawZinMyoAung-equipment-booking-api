$kind: http-request
url: "{{baseUrl}}/bookings/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has all booking fields", () => {
        const j = pm.response.json();
        ["id","equipmentId","borrowerName","startAt","endAt","purpose"].forEach(k => pm.expect(j).to.have.property(k));
      });
    language: text/javascript
order: 4000
