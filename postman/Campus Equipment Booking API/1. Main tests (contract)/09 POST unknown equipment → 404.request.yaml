$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "equipmentId": "eq-999",
      "borrowerName": "Somchai Jaidee",
      "startAt": "2026-10-22T09:00:00.000Z",
      "endAt": "2026-10-22T10:00:00.000Z",
      "purpose": "Ghost equipment"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body is JSON { error: string }", () => {
        const j = pm.response.json();
        pm.expect(j).to.have.property("error");
        pm.expect(j.error).to.be.a("string");
      });
    language: text/javascript
order: 9000
