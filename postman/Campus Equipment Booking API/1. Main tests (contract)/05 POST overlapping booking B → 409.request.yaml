$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "equipmentId": "eq-1",
      "borrowerName": "Suda Rakdee",
      "startAt": "2026-10-20T10:00:00.000Z",
      "endAt": "2026-10-20T12:00:00.000Z",
      "purpose": "Workshop"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Error body is JSON { error: string }", () => {
        const j = pm.response.json();
        pm.expect(j).to.have.property("error");
        pm.expect(j.error).to.be.a("string");
      });
    language: text/javascript
order: 5000
