$kind: http-request
url: "{{baseUrl}}/bookings/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body is JSON { error: string }", () => {
        const j = pm.response.json();
        pm.expect(j).to.have.property("error");
        pm.expect(j.error).to.be.a("string");
      });
    language: text/javascript
order: 13000
