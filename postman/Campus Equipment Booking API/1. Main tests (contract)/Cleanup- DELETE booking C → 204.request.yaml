$kind: http-request
name: "Cleanup: DELETE booking C → 204"
url: "{{baseUrl}}/bookings/{{bookingCId}}"
method: DELETE
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("bookingCId")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 204", () => pm.response.to.have.status(204));
      pm.collectionVariables.set("bookingCId", "");
    language: text/javascript
order: 15000
