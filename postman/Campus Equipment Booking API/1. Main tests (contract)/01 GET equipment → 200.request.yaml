$kind: http-request
url: "{{baseUrl}}/equipment"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("At least 2 equipment", () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 1000
