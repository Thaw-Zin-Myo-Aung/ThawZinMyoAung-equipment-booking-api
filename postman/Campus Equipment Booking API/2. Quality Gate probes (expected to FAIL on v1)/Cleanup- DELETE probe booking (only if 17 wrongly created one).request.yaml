$kind: http-request
name: "Cleanup: DELETE probe booking (only if 17 wrongly created one)"
url: "{{baseUrl}}/bookings/{{probeId}}"
method: DELETE
scripts:
  - type: beforeRequest
    code: if (!pm.collectionVariables.get("probeId")) { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 204", () => pm.response.to.have.status(204));
      pm.collectionVariables.set("probeId", "");
    language: text/javascript
order: 4000
